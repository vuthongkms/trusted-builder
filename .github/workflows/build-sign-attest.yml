# Shared, reusable build workflow for SLSA Build L3.
#
# Callers cannot change how an image is built, signed or attested: they only
# pass inputs. Every signature and attestation produced here carries this
# workflow's identity (the Fulcio SAN is
# https://github.com/vuthongkms/trusted-builder/.github/workflows/build-sign-attest.yml@<ref>),
# while the SLSA provenance records which repository and ref called it.
name: build-sign-attest

on:
  workflow_call:
    inputs:
      image:
        description: Image name without tag, for example ghcr.io/vuthongkms/demo-app
        type: string
        required: true
      tag:
        description: Tag to push besides the digest. "/" is replaced with "-".
        type: string
        required: true
      context:
        description: Docker build context inside the caller repository
        type: string
        default: .
    secrets:
      registry_token:
        description: Token used to push to the registry. Defaults to the caller's GITHUB_TOKEN.
        required: false
    outputs:
      digest:
        description: Digest of the pushed image
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ${{ inputs.image }}
    steps:
      # Checks out the CALLER's repository at the commit that triggered the run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize tag
        id: tag
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: echo "value=${RAW_TAG//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.registry_token || github.token }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ inputs.image }}:${{ steps.tag.outputs.value }}
          # Push a plain image manifest. Provenance comes from actions/attest below.
          provenance: false
          sbom: false

      # cosign-installer v4.1.2 defaults to cosign v3.0.6, which is affected by
      # GHSA-fx35-mq7g-6g98. Always pin a fixed release.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ inputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

      # VEX statements live in the caller repository and reach main through review.
      - name: Attest VEX
        if: hashFiles('vex/openvex.json') != ''
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type openvex --predicate vex/openvex.json "${IMAGE}@${DIGEST}"

      - name: Attest SLSA provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
